# Students: `docker compose up`, then open http://localhost:8080
# (first run builds the image: ~5–15 minutes, mostly downloading Mathlib)
services:
  course:
    build:
      context: .
      dockerfile: .docker/course/Dockerfile
      target: runtime
    image: math2001-course:latest
    ports:
      # localhost only: Lean can run programs (#eval), so the editor socket must not be
      # reachable from other machines on the network
      - "127.0.0.1:${COURSE_PORT:-8080}:8080"
    environment:
      # each open lesson tab runs its own Lean server (~1–2 GB RAM)
      MAX_LEAN_SESSIONS: "${MAX_LEAN_SESSIONS:-4}"
    restart: unless-stopped
